name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run unit tests
        run: node --test test/*.test.mjs

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Aggregate required checks
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All required checks passed."
