name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Replay tests compare against the pinned pre-feature revision.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run unit tests
        run: node --test test/*.test.mjs
      - name: Committed lane host pin is the placeholder
        run: node scripts/check-public-pin.mjs

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [test]
    if: always()
    steps:
      - name: Aggregate required checks
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All required checks passed."
